# 模型配置文件
#
# 分层取值，优先级由低到高：模型条目内置默认值 < defaults < providers.<名> < models[] 条目。
# 即：下层写公共字段，上层只写差异。
#
# defaults            所有模型的公共默认值（可选）。可写字段：type、temperature、seed、
#                     max_retries、timeout、extra_headers、base_url、api_key，
#                     以及网络出口字段 proxy、proxy_from_env、no_proxy、verify_ssl、
#                     ca_bundle、connect_timeout（见下）。
# providers.<名>      同一端点的公共连接参数（可选）。可写字段同 defaults。
#                     注意：provider / name / model 不可写在 defaults 或 provider 块内。
# models[]            模型条目，必填 name 与 model，其余省略即继承 defaults 与 provider。
#
# 各字段含义：
#   name           唯一名称，供切换时引用；active、--model、LLM_PROFILE 均填此名，不是 provider 名
#   model          传给供应商的模型标识
#   provider       引用 providers 中的键；省略即旧格式条目，须自行提供 base_url 等必填字段
#   type           模型类型，当前支持 openai（OpenAI 兼容端点）
#   base_url       API Base URL
#   api_key        密钥：写 ${ENV_VAR} 从环境变量读取，支持 ${ENV_VAR:-默认值}
#   temperature    采样温度，默认 0.7
#   seed           采样种子，默认不写（= 不发送该参数，由供应商自由采样）。
#                  写上同一个整数可压低重复运行之间的方差——**但不承诺输出确定**，
#                  服务端实现与并发仍会引入差异。注意「不写」与「写 0」不同：0 是合法种子。
#   max_retries    失败重试次数，默认 2
#   timeout        请求超时秒数，默认 60
#   extra_headers  附加请求头（可选）；与下层按「键」合并，本层同名键优先
#   structured_output  结构化输出的约束方式，取值：
#                   json_object（默认，发送 response_format={"type":"json_object"}）
#                   json_schema（发送完整 JSON Schema，端点支持时最严格）
#                   prompt_only（不发 response_format，只把 schema 写进提示词）
#                   端点若不接受 response_format，运行期会自动降级为 prompt_only 重试一次并打 WARNING。
#
# 网络出口字段（内网 / 代理环境用；同样遵循三级继承，支持 ${VAR} 展开）：
#   proxy           显式代理 URL，如 http://127.0.0.1:7890 或 socks5://...。留空 = 不指定。
#                   **写了它就以它为准，环境变量不再参与。**
#   proxy_from_env  是否读取 HTTP_PROXY / HTTPS_PROXY / NO_PROXY 环境变量，默认 true。
#                   默认值与 openai SDK 自带客户端一致，故不配置网络字段时行为完全不变。
#   no_proxy        逗号分隔的直连主机名单，命中者不经代理（proxy 生效时才起作用）。
#   verify_ssl      是否校验服务端证书，默认 true。自签名证书调试时可置 false。
#   ca_bundle       自定义 CA 证书路径；非空时优先于 verify_ssl（推荐用它代替关校验）。
#   connect_timeout 建连超时秒数，默认不写（沿用 SDK 的 connect 5s）。
#                   只影响建连；流式读取由 llm.py 的首 token / chunk 间隔超时独立把关。
#
#   注意：一旦上述任一字段被设成**非默认值**，本程序就会自建底层传输（trust_env 取
#   proxy_from_env），而不是继续用 SDK 自带客户端。只写 proxy_from_env: true 或
#   verify_ssl: true 这类「与默认相同」的值不会触发重建，也就不会顺带改掉超时等参数。
#
# 内网代理示例（放在 defaults 下即全局生效；放在某个 providers.<名> 下则只影响该端点）：
#   defaults:
#     proxy: ${INTRANET_PROXY:-}      # 走环境变量，未设置时留空即直连
#     no_proxy: localhost,127.0.0.1,.internal
#
# 空值（如 `timeout:`）视为「未填写」，沿用下层取值；extra_headers 按键浅合并，
# 其余字段整体覆盖。
#
# 新增模型：在 models 追加一个条目，填写 provider 与 model 即可，无需改动代码。
# 新增供应商：在 providers 追加一个块，供多个模型条目共用。
#
# 生效项与密钥状态可用 `.venv/bin/python scripts/show_models.py` 查看。
# 密钥优先取 api_key 展开后的字面量，其次环境变量 DEEPSEEK_API_KEY / LLM_API_KEY，
# 最后回退到 ~/.config/opencode/opencode.json 中同端点（按 provider 名或 base_url 匹配）的 apiKey。

active: deepseek-v4.1-flash

defaults:
  type: openai
  temperature: 0.7
  # seed: 20240914   # 取消注释即可对全部模型固定采样种子，压低重复运行之间的方差
  max_retries: 2
  timeout: 60

providers:
  deepseek:
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY}

  opencode:
    base_url: https://opencode.ai/zen/go/v1
    api_key: ${OPENCODE_API_KEY}

models:
  # 默认启用 opencode-go 端点（https://opencode.ai/zen/go/v1）。密钥未显式配在
  # providers.opencode 时，运行期按 base_url 回退到 ~/.config/opencode/opencode.json
  # 中同名端点的 apiKey；show_models.py 的 KEY 列走同一条链。
  - name: deepseek-v4.1-flash
    provider: opencode
    model: deepseek-v4.1-flash

  - name: deepseek-chat
    provider: deepseek
    model: deepseek-chat

  - name: deepseek-reasoner
    provider: deepseek
    model: deepseek-reasoner

  # 端点上实际存在的是 glm-5.2 / glm-5.3 / glm-5.3-flash；glm-5.2-flash 与
  # glm-5.3-flash-air 均不存在（调用直接返回 401 ModelError）。
  - name: glm-5.2
    provider: opencode
    model: glm-5.2

  - name: glm-5.3-flash
    provider: opencode
    model: glm-5.3-flash
