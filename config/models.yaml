# 模型配置文件
#
# 分层取值，优先级由低到高：模型条目内置默认值 < defaults < providers.<名> < models[] 条目。
# 即：下层写公共字段，上层只写差异。
#
# defaults            所有模型的公共默认值（可选）。可写字段：type、temperature、seed、
#                     max_retries、timeout、extra_headers、base_url、api_key。
# providers.<名>      同一端点的公共连接参数（可选）。可写字段同 defaults。
#                     注意：provider / name / model 不可写在 defaults 或 provider 块内。
# models[]            模型条目，必填 name 与 model，其余省略即继承 defaults 与 provider。
#
# 各字段含义：
#   name           唯一名称，供切换时引用；active、--model、LLM_PROFILE 均填此名，不是 provider 名
#   model          传给供应商的模型标识
#   provider       引用 providers 中的键；省略即旧格式条目，须自行提供 base_url 等必填字段
#   type           模型类型，当前支持 openai（OpenAI 兼容端点）
#   base_url       API Base URL
#   api_key        密钥：写 ${ENV_VAR} 从环境变量读取，支持 ${ENV_VAR:-默认值}
#   temperature    采样温度，默认 0.7
#   seed           采样种子，默认不写（= 不发送该参数，由供应商自由采样）。
#                  写上同一个整数可压低重复运行之间的方差——**但不承诺输出确定**，
#                  服务端实现与并发仍会引入差异，故它只消除方差的一个来源。
#                  注意「不写」与「写 0」不同：0 是一个合法种子。
#   max_retries    失败重试次数，默认 2（用于 create_llm）
#   timeout        请求超时秒数，默认 60（用于 create_llm）
#   extra_headers  附加请求头（可选）；与下层按「键」合并，本层同名键优先
#
# roles                 可选的节点角色路由表：角色 -> 模型 name（**不是 provider 名**）。
#                       可写角色：arch（架构归纳）、review（模块检视）、rebuttal（反驳）、
#                       summary（模块摘要）。写错角色名或指向不存在的模型会直接报错，
#                       不会静默失效。优先级：--model > roles > LLM_PROFILE > active。
#                       未列出的角色走默认解析链；整块省略时行为与从前完全一致。
#                       改这里会改变运行清单里的模型指纹，故已产出的断点会整体失效重算。
#
# 空值（如 `timeout:`）视为「未填写」，沿用下层取值；extra_headers 按键浅合并，
# 其余字段整体覆盖。合并后的最终取值可用 `.venv/bin/python scripts/run_review.py --list-models` 查看。
#
# 新增模型：在 models 追加一个条目，填写 provider 与 model 即可，无需改动代码。
# 新增供应商：在 providers 追加一个块，供多个模型条目共用。
#
# 兼容性：不含 provider 字段的条目即为旧格式，可直接与本格式混用；
#        未声明 providers / defaults 块的旧配置文件行为完全不变。

active: deepseek-v4.1-flash

# 角色路由示例（默认全部注释掉，即所有阶段都用生效模型）：
# roles:
#   review: deepseek-reasoner     # 检视是效果的决定性环节，值得用强模型
#   rebuttal: deepseek-reasoner   # 反驳需要与检视不同的视角
#   summary: deepseek-chat        # 纯文字加工，用便宜的
roles: {}

defaults:
  type: openai
  temperature: 0.7
  # seed: 20240914   # 取消注释即可对全部模型固定采样种子，压低重复运行之间的方差
  max_retries: 2
  timeout: 60

providers:
  deepseek:
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY}

  opencode:
    base_url: https://opencode.ai/zen/go/v1
    api_key: ${OPENCODE_API_KEY}

models:
  # 默认启用 opencode-go 端点（https://opencode.ai/zen/go/v1）。密钥未显式配在
  # providers.opencode 时，运行期按 base_url 回退到 ~/.config/opencode/opencode.json
  # 中同名端点的 apiKey；--list-models 的 KEY 列走同一条链。
  - name: deepseek-v4.1-flash
    provider: opencode
    model: deepseek-v4.1-flash

  - name: deepseek-chat
    provider: deepseek
    model: deepseek-chat

  - name: deepseek-reasoner
    provider: deepseek
    model: deepseek-reasoner

  - name: glm-5.3-flash
    provider: opencode
    model: glm-5.3-flash
