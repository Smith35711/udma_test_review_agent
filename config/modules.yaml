# 模块映射配置（文件级）
#
# 每个 .c 文件为一个模块，需在此显式声明标识（M01…）；同目录同名的 .h 会自动并入该模块。
# 要求：所有扫描到的 .c 文件都必须被映射，否则启动报错。
# id：模块标识，形如 M01；path：相对被测项目根的 .c 路径。
#
# 选择方式（CLI --modules / 接口 modules 字段）：
#   all            全部模块（按 id 升序）
#   M01            单个
#   M01,M03        多个
#   M01-M05        区间（可与逗号组合，如 M01-M03,M08）
#
# 可复制本文件并按被测项目修改；亦可用环境变量 MODULES_CONFIG 指定其他路径。

modules:
  - id: M01
    path: buffer.c
  - id: M02
    path: parser.c
  - id: M03
    path: resource.c
